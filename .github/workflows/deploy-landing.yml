name: Deploy MacTheme landing

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "shared/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mactheme-landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install landing dependencies
        run: npm ci --prefix landing
      - name: Check landing types
        run: npm run landing:check
      - name: Build landing static export
        run: npm run landing:build
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
